services:
  db:
    image: postgres:16
    container_name: postgres_taller
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taller_db
    ports:
      - "5432:5432"
    volumes:
      - taller_pgdata:/var/lib/postgresql/data
      # Lee automáticamente los .sql en orden alfabético (01, 02, 03) al inicializar el volumen:
      - ../database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taller_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taller_pgdata:
